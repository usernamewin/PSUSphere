{% extends 'base.html' %} {% load static %} {% block content %}
<style>
  .chart-container {
    position: relative;
    height: 350px;
    width: 100%;
  }

  @media (max-width: 768px) {
    .chart-container {
      height: 300px;
    }
  }
</style>

<div class="content">
<div class="container-fluid">
  <h4 class="page-title">Dashboard</h4>
<div class="page-inner">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Bar Chart</div>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="barChart" ></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Pie Chart</div>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="pieChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Line Char</div>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="lineChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Horizontal Bar Chart</div>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="horizontalBarChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12"><div class="card">
      <div class="card-header">
        <div class="card-title">Floating Chart</div>
      </div>
      <div class="card-body">
        <div class="chart-container">
          <canvas id="floatingChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>  
{% endblock %}

{% block chart %}
<script>
  function loadChartData() {
    // Bar Chart
    fetch("/barChart")
        .then((response) => response.json())
        .then((data) => {
            var orgNames = Object.keys(data);
            var studentCounts = Object.values(data);
            var barChart = document.getElementById("barChart").getContext("2d");

            new Chart(barChart, {
                type: "bar",
                data: {
                    labels: orgNames,
                    datasets: [{
                        label: "Number of Students per Organization",
                        data: studentCounts,
                        backgroundColor: "#1d7af3",
                        borderColor: "#1d7af3",
                        borderWidth: 1,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                    plugins: { legend: { display: false } }
                }
            });
        })
        .catch((error) => console.error("Error:", error));

    // Pie Chart
    fetch("/pieChart")
        .then((response) => response.json())
        .then((data) => {
            var programNames = Object.keys(data);
            var studentCounts = Object.values(data);
            var pieChart = document.getElementById("pieChart").getContext("2d");

            new Chart(pieChart, {
                type: "pie",
                data: {
                    labels: programNames,
                    datasets: [{
                        data: studentCounts,
                        backgroundColor: [
                            "#1d7af3", "#f3545d", "#fdaf4b", "#47c363", "#5c7bd9", "#ff66cc", "#66cccc", "#cc9966"
                        ],
                        borderWidth: 1,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: "bottom",
                            labels: { fontColor: "rgb(154, 154, 154)", fontSize: 12, usePointStyle: true }
                        }
                    }
                }
            });
        })
        .catch((error) => console.error("Error:", error));

    // Line Chart
    fetch("/lineChart/")
            .then((response) => response.json())
            .then((result_with_month_names) => {
                var months = Object.keys(result_with_month_names);
                var counts = Object.values(result_with_month_names);
                var lineChart = document.getElementById("lineChart").getContext("2d");

                new Chart(lineChart, {
                    type: "line",
                    data: {
                    labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
                    datasets: [
                        {
                            label: "Active Users",
                            borderColor: "#1d7af3",
                            pointBorderColor: "#FFF",
                            pointBackgroundColor: "#1d7af3",
                            pointBorderWidth: 2,
                            pointHoverRadius: 4,
                            pointHoverBorderWidth: 1,
                            pointRadius: 4,
                            backgroundColor: "transparent",
                            fill: true,
                            borderWidth: 2,
                            data: counts,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    legend: {
                        position: "bottom",
                        labels: {
                            padding: 10,
                            fontColor: "#1d7af3",
                        },
                    },
                    tooltips: {
                        bodySpacing: 4,
                        mode: "nearest",
                        intersect: 0,
                        position: "nearest",
                        xPadding: 10,
                        yPadding: 10,
                        caretPadding: 10,
                    },
                    layout: {
                        padding: { left: 15, right: 15, top: 15, bottom: 15 },
                    },
                },
            });
        })
        .catch((error) => console.error("Error:", error));

    // Horizontal Bar Chart
    fetch("/horizontalBarChart")
        .then((response) => response.json())
        .then((data) => {
            var programNames = Object.keys(data);
            var studentCounts = Object.values(data);
            var horizontalBarChart = document.getElementById("horizontalBarChart").getContext("2d");

            new Chart(horizontalBarChart, {
                type: "bar",
                data: {
                    labels: programNames,
                    datasets: [{
                        label: "Students per Program",
                        data: studentCounts,
                        backgroundColor: "#47c363"
                    }]
                },
                options: {
                    indexAxis: 'y', // This makes it horizontal
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        })
        .catch((error) => console.error("Error:", error));

    // Floating Bubble Chart
    fetch("/floatingChart")
        .then((response) => response.json())
        .then((data) => {
            var floatingChart = document.getElementById("floatingChart").getContext("2d");

            new Chart(floatingChart, {
                type: 'bubble',
                data: {
                    datasets: data.map(item => ({
                        label: item.label,
                        data: [{ x: item.x, y: item.y, r: item.r }],
                        backgroundColor: 'rgba(29, 122, 243, 0.5)'
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': (' + context.raw.x + ', ' + context.raw.y + ')';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Organization Name Length' }
                        },
                        y: {
                            title: { display: true, text: 'Number of Students' },
                            beginAtZero: true
                        }
                    }
                }
            });
        })
        .catch((error) => console.error("Error:", error));
}
loadChartData();

</script>
{% endblock %}
